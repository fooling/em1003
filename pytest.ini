[pytest]
# Test scaffold for the EM1003 custom integration.
# See tests/conftest.py and tests/fakes.py module docstrings for the fixtures
# and fake BLE world this config exists to support.

testpaths = tests

# All test coroutines/fixtures run as asyncio tests without needing
# @pytest.mark.asyncio on every function.
asyncio_mode = auto

# pytest-asyncio >= 1.x wants an explicit default loop scope for fixtures;
# "function" matches pytest-homeassistant-custom-component's own `hass`
# fixture (function-scoped) and keeps every test isolated on its own loop.
asyncio_default_fixture_loop_scope = function

# pytest-homeassistant-custom-component registers a lot of asyncio/thread
# cleanup warnings as errors upstream; we keep default filterwarnings here
# (nothing project-specific to silence yet).
